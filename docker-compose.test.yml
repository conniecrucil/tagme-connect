version: '3.8'

services:
  minio-test:
    image: minio/minio:latest
    container_name: tagme-minio-test
    ports:
      - "9002:9000"  # API
      - "9003:9001"  # Web console
      - "9011:9010"  # Website hosting
    environment:
      MINIO_ROOT_USER: ${MINIO_TEST_ROOT_USER:-miniotest}
      MINIO_ROOT_PASSWORD: ${MINIO_TEST_ROOT_PASSWORD:-miniotest123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9003
    volumes:
      - minio-data-test:/data
      - ./supabase/init-minio.sh:/docker-entrypoint-initdb.d/init-minio.sh
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tagme-test-network

  netlify-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tagme-netlify-test
    ports:
      - "8889:8888"
    environment:
      - NODE_ENV=test
      # MinIO/S3 configuration for test
      - S3_ENDPOINT=http://minio-test:9000
      - S3_ACCESS_KEY=${MINIO_TEST_ROOT_USER:-miniotest}
      - S3_SECRET_KEY=${MINIO_TEST_ROOT_PASSWORD:-miniotest123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tagme-test}
      - S3_FORCE_PATH_STYLE=true
      - S3_WEBSITE_ENDPOINT=http://minio-test:9010
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      minio-test:
        condition: service_healthy
    networks:
      - tagme-test-network

  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: tagme-playwright-test
    depends_on:
      - netlify-test
    volumes:
      - .:/app
    environment:
      - CI=true
    command: npx playwright test
    networks:
      - tagme-test-network

volumes:
  minio-data-test:
    driver: local

networks:
  tagme-test-network:
    driver: bridge


