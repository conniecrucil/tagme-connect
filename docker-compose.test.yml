version: '3.8'

services:
  postgres-test:
    image: supabase/postgres:15.1.1.78
    container_name: tagme-postgres-test
    ports:
      - "54422:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tagme-test-network

  postgrest-test:
    image: postgrest/postgrest:v12.0.2
    container_name: tagme-postgrest-test
    ports:
      - "54421:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-test:5432/postgres_test
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - tagme-test-network

  minio-test:
    image: minio/minio:latest
    container_name: tagme-minio-test
    ports:
      - "9002:9000"  # API
      - "9003:9001"  # Web console
      - "9011:9010"  # Website hosting
    environment:
      MINIO_ROOT_USER: ${MINIO_TEST_ROOT_USER:-miniotest}
      MINIO_ROOT_PASSWORD: ${MINIO_TEST_ROOT_PASSWORD:-miniotest123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9003
    volumes:
      - minio-data-test:/data
      - ./supabase/init-minio.sh:/docker-entrypoint-initdb.d/init-minio.sh
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tagme-test-network

  netlify-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tagme-netlify-test
    ports:
      - "8889:8888"
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-test:5432/postgres_test
      - SUPABASE_URL=http://postgrest-test:3000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      # MinIO/S3 configuration for test
      - S3_ENDPOINT=http://minio-test:9000
      - S3_ACCESS_KEY=${MINIO_TEST_ROOT_USER:-miniotest}
      - S3_SECRET_KEY=${MINIO_TEST_ROOT_PASSWORD:-miniotest123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-tagme-test}
      - S3_FORCE_PATH_STYLE=true
      - S3_WEBSITE_ENDPOINT=http://minio-test:9010
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    networks:
      - tagme-test-network

  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: tagme-playwright-test
    depends_on:
      - netlify-test
    volumes:
      - .:/app
    environment:
      - CI=true
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-test:5432/postgres_test
    command: npx playwright test
    networks:
      - tagme-test-network

volumes:
  postgres-data-test:
    driver: local
  minio-data-test:
    driver: local

networks:
  tagme-test-network:
    driver: bridge


